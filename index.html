<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的地图记忆</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #map { width: 100%; height: 100%; }
  .topbar { position: absolute; top: 10px; left: 10px; z-index: 1000; display: flex; gap: 8px; flex-wrap: wrap; }
  .topbar button { background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; padding: 18px; }
  .modal h3 { font-size: 17px; margin-bottom: 12px; }
  .modal label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
  .modal input[type=text], .modal textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 15px; font-family: inherit; }
  .modal textarea { min-height: 90px; resize: vertical; }
  .modal input[type=file] { font-size: 13px; margin-top: 4px; }
  .modal .btns { display: flex; gap: 10px; margin-top: 18px; }
  .modal .btns button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 15px; cursor: pointer; }
  .btn-save { background: #2f80ed; color: #fff; }
  .btn-cancel { background: #eee; color: #333; }
  .btn-danger { background: #eb5757; color: #fff; }
  .preview-img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: none; }
  .detail-img { width: 100%; border-radius: 10px; margin: 10px 0; }
  .detail-text { font-size: 15px; line-height: 1.6; white-space: pre-wrap; margin: 8px 0; }
  .detail-song { font-size: 14px; color: #2f80ed; word-break: break-all; }
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
  <button id="exportBtn">导出数据</button>
  <button id="importBtn">导入数据</button>
</div>

<div class="modal-mask" id="formMask">
  <div class="modal">
    <h3 id="formTitle">添加记忆</h3>
    <label>标题</label><input type="text" id="fTitle">
    <label>日记</label><textarea id="fText"></textarea>
    <label>照片</label><input type="file" id="fPhoto" accept="image/*">< img class="preview-img" id="fPreview">
    <label>歌曲名</label><input type="text" id="fSongName">
    <label>歌曲链接</label><input type="text" id="fSongUrl">
    <div class="btns"><button class="btn-cancel" id="fCancel">取消</button><button class="btn-save" id="fSave">保存</button></div>
  </div>
</div>

<div class="modal-mask" id="detailMask">
  <div class="modal">
    <h3 id="dTitle"></h3><div class="detail-text" id="dText"></div>
    < img class="detail-img" id="dImg" style="display:none"><div class="detail-song" id="dSong"></div>
    <div class="btns"><button class="btn-danger" id="dDelete">删除</button><button class="btn-cancel" id="dClose">关闭</button></div>
  </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
let map, memories = [], markers = [], editingId = null, currentLatLng = null, pendingPhoto = null, viewingId = null;

// 1. 初始化地图（直接执行，绝不卡顿）
map = L.map('map').setView([31.23, 121.47], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
map.on('click', function(e) { openForm(e.latlng, null); });

function renderMarkers() {
  markers.forEach(m => map.removeLayer(m)); markers = [];
  memories.forEach(mem => {
    const marker = L.marker([mem.lat, mem.lng]).addTo(map);
    marker.on('click', function(e) { L.DomEvent.stopPropagation(e); openDetail(mem.id); });
    markers.push(marker);
  });
}

// 2. 界面逻辑
function openForm(latlng, mem) {
  editingId = mem ? mem.id : null; currentLatLng = latlng || (mem ? { lat: mem.lat, lng: mem.lng } : null);
  pendingPhoto = mem ? (mem.photo || null) : null;
  document.getElementById('formTitle').textContent = mem ? '编辑' : '添加';
  document.getElementById('fTitle').value = mem ? (mem.title || '') : '';
  document.getElementById('fText').value = mem ? (mem.text || '') : '';
  document.getElementById('fSongName').value = mem ? (mem.songName || '') : '';
  document.getElementById('fSongUrl').value = mem ? (mem.songUrl || '') : '';
  const preview = document.getElementById('fPreview');
  if (pendingPhoto) { preview.src = pendingPhoto; preview.style.display = 'block'; } else { preview.style.display = 'none'; }
  document.getElementById('formMask').classList.add('show');
}

function closeForm() { document.getElementById('formMask').classList.remove('show'); editingId = null; pendingPhoto = null; }

function openDetail(id) {
  const mem = memories.find(m => m.id === id); if (!mem) return; viewingId = id;
  document.getElementById('dTitle').textContent = mem.title || '无标题';
  document.getElementById('dText').textContent = mem.text || '';
  const img = document.getElementById('dImg');
  if (mem.photo) { img.src = mem.photo; img.style.display = 'block'; } else { img.style.display = 'none'; }
  document.getElementById('dSong').innerHTML = mem.songName ? ('🎵 ' + mem.songName) : '';
  document.getElementById('detailMask').classList.add('show');
}
function closeDetail() { document.getElementById('detailMask').classList.remove('show'); }

// 3. 事件绑定
document.getElementById('fPhoto').addEventListener('change', function(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { pendingPhoto = ev.target.result; document.getElementById('fPreview').src = pendingPhoto; document.getElementById('fPreview').style.display = 'block'; };
  reader.readAsDataURL(file);
});

document.getElementById('fSave').addEventListener('click', function() {
  const title = document.getElementById('fTitle').value.trim();
  const text = document.getElementById('fText').value.trim();
  if (!title && !text && !pendingPhoto) return alert('填点内容吧');
  
  if (editingId) {
    const mem = memories.find(m => m.id === editingId);
    mem.title = title; mem.text = text; mem.photo = pendingPhoto;
    mem.songName = document.getElementById('fSongName').value.trim();
    mem.songUrl = document.getElementById('fSongUrl').value.trim();
  } else {
    memories.push({ id: Date.now().toString(), lat: currentLatLng.lat, lng: currentLatLng.lng, title, text, photo: pendingPhoto, songName: document.getElementById('fSongName').value.trim(), songUrl: document.getElementById('fSongUrl').value.trim() });
  }
  renderMarkers(); closeForm();
});

document.getElementById('dDelete').addEventListener('click', function() {
  if (!viewingId || !confirm('确定删除？')) return;
  memories = memories.filter(m => m.id !== viewingId); renderMarkers(); closeDetail();
});

document.getElementById('fCancel').addEventListener('click', closeForm);
document.getElementById('dClose').addEventListener('click', closeDetail);
</script>
</body>
</html>
